name: Build Android APK (debug)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: List bundle tasks (diagnostic, never fails)
        run: cd android && ./gradlew tasks --all 2>&1 | grep -i -E "bundle|hermes" || echo "NO_BUNDLE_OR_HERMES_TASKS_FOUND"

      - name: Check hermesc availability (diagnostic, never fails)
        run: ls node_modules/react-native/sdks/hermesc/ 2>&1 || echo "NO_HERMESC_DIR"

      - name: Bundle JS via CLI (Gradle has no bundle task in this project)
        run: |
          mkdir -p android/app/src/main/assets android/app/src/main/res
          npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Verify APK contains bundle (fail loudly, never ship bundle-less)
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep "assets/" || true
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q "assets/index.android.bundle" || (echo "ERROR: index.android.bundle NOT in APK — refusing to publish a bundle-less APK" && exit 1)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: muse-like-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "preview-${{ github.run_number }}" android/app/build/outputs/apk/debug/app-debug.apk --title "Preview build ${{ github.run_number }}" --notes "Debug APK built by GitHub Actions (preview, not a stable release)." --prerelease
