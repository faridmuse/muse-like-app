name: Build Android APK (debug)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Generate JS bundle via release task (debug has no bundle task)
        run: cd android && ./gradlew :app:createBundleReleaseJsAndAssets --no-daemon

      - name: Copy bundle into debug assets (fail loudly if not generated)
        run: |
          BUNDLE=$(find android/app/build -name "index.android.bundle" -type f | head -1)
          if [ -z "$BUNDLE" ]; then
            echo "ERROR: index.android.bundle not found after release bundle task — refusing to assemble bundle-less"
            exit 1
          fi
          mkdir -p android/app/src/main/assets
          cp "$BUNDLE" android/app/src/main/assets/index.android.bundle
          ls -lh android/app/src/main/assets/index.android.bundle

      - name: Copy generated assets (fonts/icons) into debug assets
        run: |
          GEN=$(find android/app/build/generated/assets -maxdepth 1 -type d -name "createBundle*" 2>/dev/null | head -1)
          if [ -n "$GEN" ]; then
            echo "Generated assets dir: $GEN"
            find "$GEN" -type f | head -50
            cp -r "$GEN"/. android/app/src/main/assets/
            echo "Copied generated assets tree into debug assets"
          else
            echo "WARNING: no generated assets dir found under android/app/build/generated/assets"
          fi
          echo "All .ttf files under android/app/build:"
          find android/app/build -name "*.ttf" -type f 2>/dev/null | head -50
          echo "Copying every .ttf found under android/app/build into debug assets/fonts (flattened, in addition to the tree copy above):"
          mkdir -p android/app/src/main/assets/fonts
          find android/app/build -name "*.ttf" -type f 2>/dev/null -exec cp -n {} android/app/src/main/assets/fonts/ \; || true
          echo "Debug assets now contain:"
          find android/app/src/main/assets -type f | head -80

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Verify APK contains bundle (fail loudly, never ship bundle-less)
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep "assets/" || true
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q "assets/index.android.bundle" || (echo "ERROR: index.android.bundle NOT in APK — refusing to publish a bundle-less APK" && exit 1)

      - name: Verify APK contains fonts (fail loudly, never ship font-less)
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -iE "\.ttf" || (echo "ERROR: no .ttf in APK — fonts did not make it into the debug APK, refusing to publish" && exit 1)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: muse-like-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "preview-${{ github.run_number }}" android/app/build/outputs/apk/debug/app-debug.apk --title "Preview build ${{ github.run_number }}" --notes "Debug APK built by GitHub Actions (preview, not a stable release)." --prerelease
